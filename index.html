<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mini GTA 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100vw; height:100vh; overflow:hidden; background:#87ceeb; touch-action:none; font-family:Arial,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }
  #hud { position:fixed; top:12px; left:12px; color:#fff; font-size:15px; text-shadow:2px 2px 4px #000; z-index:10; pointer-events:none; }
  #hud div { margin-bottom:4px; }
  #joyBase { position:fixed; bottom:30px; left:30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.5); z-index:20; touch-action:none; }
  #joyKnob { position:absolute; top:50%; left:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:rgba(255,255,255,0.6); pointer-events:none; }
  .btn { position:fixed; border-radius:50%; color:#fff; font-weight:bold; z-index:20; touch-action:none; border:2px solid; user-select:none; -webkit-user-select:none; display:flex; align-items:center; justify-content:center; }
  #gasBtn { bottom:40px; right:30px; width:100px; height:100px; background:rgba(0,200,80,0.5); border-color:#0f8; font-size:18px; }
  #brakeBtn { bottom:155px; right:45px; width:80px; height:80px; background:rgba(255,60,60,0.5); border-color:#f33; font-size:14px; }
  #msg { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#ffd700; font-size:30px; font-weight:bold; text-shadow:3px 3px 8px #000; display:none; z-index:30; text-align:center; padding:20px 28px; background:rgba(0,0,0,0.65); border-radius:16px; }
</style>
</head>
<body>
<div id="hud">
  <div id="objText">🚗 Yellow box tak jao</div>
  <div id="spd">Speed: 0</div>
</div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="gasBtn" class="btn">GAS</div>
<div id="brakeBtn" class="btn">BRAKE</div>
<div id="msg"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 150, 400);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 800);
camera.position.set(0, 10, -14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(60, 120, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -140;
sun.shadow.camera.right = 140;
sun.shadow.camera.top = 140;
sun.shadow.camera.bottom = -140;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshLambertMaterial({ color: 0x555555 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Roads
const roadMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
for (let i = -4; i <= 4; i++) {
  const r1 = new THREE.Mesh(new THREE.PlaneGeometry(600, 16), roadMat);
  r1.rotation.x = -Math.PI/2;
  r1.position.set(0, 0.02, i*70);
  r1.receiveShadow = true;
  scene.add(r1);
  const r2 = new THREE.Mesh(new THREE.PlaneGeometry(16, 600), roadMat);
  r2.rotation.x = -Math.PI/2;
  r2.position.set(i*70, 0.02, 0);
  r2.receiveShadow = true;
  scene.add(r2);
}

// Buildings - spawn area kept clear
const buildings = [];
const colors = [0x9b7a5a, 0x7a8a9a, 0xa89a7a, 0x8a7a8a, 0x7a8a7a, 0xb0a090];

for (let gx = -3; gx <= 3; gx++) {
  for (let gz = -3; gz <= 3; gz++) {
    if (gx === 0 && gz === 0) continue;
    if (Math.random() < 0.1) continue;
    const bx = gx*70 + (Math.random()-0.5)*14;
    const bz = gz*70 + (Math.random()-0.5)*14;
    // Keep center clear
    if (Math.hypot(bx, bz) < 45) continue;
    const bw = 22 + Math.random()*16;
    const bd = 22 + Math.random()*16;
    const bh = 18 + Math.random()*40;
    const c = colors[Math.floor(Math.random()*colors.length)];
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(bw, bh, bd),
      new THREE.MeshLambertMaterial({ color: c })
    );
    m.position.set(bx, bh/2, bz);
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
    buildings.push({ x: bx, z: bz, w: bw, d: bd });
  }
}

// Car
const car = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.4, 0.9, 4.8),
  new THREE.MeshLambertMaterial({ color: 0xff2222 })
);
body.position.y = 0.8;
body.castShadow = true;
car.add(body);

const roof = new THREE.Mesh(
  new THREE.BoxGeometry(1.9, 0.8, 2.2),
  new THREE.MeshLambertMaterial({ color: 0x222222 })
);
roof.position.set(0, 1.65, -0.3);
roof.castShadow = true;
car.add(roof);

const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 14);
const wheelMat = new THREE.MeshLambertMaterial({ color: 0x0a0a0a });
[[-1.25,0.45,1.5],[1.25,0.45,1.5],[-1.25,0.45,-1.5],[1.25,0.45,-1.5]].forEach(([x,y,z])=>{
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI/2;
  w.position.set(x, y, z);
  w.castShadow = true;
  car.add(w);
});
car.position.set(0, 0, 0);
scene.add(car);

// Objective
const objective = new THREE.Mesh(
  new THREE.BoxGeometry(3, 3, 3),
  new THREE.MeshLambertMaterial({ color: 0xffd700, emissive: 0x886600 })
);
objective.position.set(80, 2, -80);
objective.castShadow = true;
scene.add(objective);

// Physics
let speed = 0;
const MAX_SPEED = 1.3;
const ACCEL = 0.045;
const FRICTION = 0.96;
let heading = 0;
let won = false;

function collide(x, z, r) {
  for (const b of buildings) {
    const dx = Math.max(Math.abs(x-b.x) - b.w/2, 0);
    const dz = Math.max(Math.abs(z-b.z) - b.d/2, 0);
    if (dx*dx + dz*dz < r*r) return true;
  }
  return false;
}

// Inputs
const keys = {};
const state = { gasTouch:false, brakeTouch:false };

addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Joystick (pointer events - works on mobile + desktop)
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyId = null, joyCx = 0, joyCy = 0;
let joyVec = { x:0, y:0 };

function joyStart(e) {
  joyId = e.pointerId;
  try { joyBase.setPointerCapture(e.pointerId); } catch(_) {}
  const r = joyBase.getBoundingClientRect();
  joyCx = r.left + r.width/2;
  joyCy = r.top + r.height/2;
  joyMove(e);
}
function joyMove(e) {
  if (e.pointerId !== joyId) return;
  const dx = e.clientX - joyCx;
  const dy = e.clientY - joyCy;
  const maxR = 55;
  const len = Math.hypot(dx, dy);
  const cl = Math.min(len, maxR);
  const nx = len ? dx/len : 0;
  const ny = len ? dy/len : 0;
  joyKnob.style.transform = `translate(${nx*cl}px, ${ny*cl}px)`;
  joyVec.x = (nx*cl)/maxR;
  joyVec.y = (ny*cl)/maxR;
}
function joyEnd(e) {
  if (e && e.pointerId !== joyId) return;
  joyId = null;
  joyVec = { x:0, y:0 };
  joyKnob.style.transform = 'translate(0,0)';
}

joyBase.addEventListener('pointerdown', e => { e.preventDefault(); joyStart(e); });
joyBase.addEventListener('pointermove', joyMove);
joyBase.addEventListener('pointerup', joyEnd);
joyBase.addEventListener('pointercancel', joyEnd);

// Gas / brake
const gasBtn = document.getElementById('gasBtn');
const brakeBtn = document.getElementById('brakeBtn');

function bindHold(el, onDown, onUp) {
  let activeId = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    activeId = e.pointerId;
    try { el.setPointerCapture(e.pointerId); } catch(_) {}
    onDown();
  });
  el.addEventListener('pointerup', e => { if (e.pointerId === activeId) { onUp(); activeId = null; } });
  el.addEventListener('pointercancel', () => { onUp(); activeId = null; });
}
bindHold(gasBtn, () => state.gasTouch = true, () => state.gasTouch = false);
bindHold(brakeBtn, () => state.brakeTouch = true, () => state.brakeTouch = false);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Loop
const clock = new THREE.Clock();
const msgEl = document.getElementById('msg');
const spdEl = document.getElementById('spd');
const objEl = document.getElementById('objText');

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05) * 60;

  let throttle = 0;
  let steer = 0;

  if (keys['w'] || keys['arrowup'] || state.gasTouch) throttle += 1;
  if (keys['s'] || keys['arrowdown'] || state.brakeTouch) throttle -= 1;
  if (keys['a'] || keys['arrowleft']) steer += 1;
  if (keys['d'] || keys['arrowright']) steer -= 1;

  if (Math.abs(joyVec.y) > 0.15) throttle += -joyVec.y;
  if (Math.abs(joyVec.x) > 0.15) steer += -joyVec.x;

  throttle = Math.max(-1, Math.min(1, throttle));
  steer = Math.max(-1, Math.min(1, steer));

  speed += throttle * ACCEL * dt;
  speed *= Math.pow(FRICTION, dt);
  speed = Math.max(-MAX_SPEED*0.5, Math.min(MAX_SPEED, speed));

  if (Math.abs(speed) > 0.02) {
    heading += steer * 0.05 * dt * (speed / MAX_SPEED);
  }

  const fx = Math.sin(heading);
  const fz = Math.cos(heading);
  const nx = car.position.x + fx * speed * dt;
  const nz = car.position.z + fz * speed * dt;
  const r = 2.6;

  if (!collide(nx, car.position.z, r)) car.position.x = nx; else speed *= -0.15;
  if (!collide(car.position.x, nz, r)) car.position.z = nz; else speed *= -0.15;

  car.rotation.y = heading;

  // Camera
  const camTX = car.position.x - fx * 13;
  const camTZ = car.position.z - fz * 13;
  camera.position.x += (camTX - camera.position.x) * 0.15;
  camera.position.z += (camTZ - camera.position.z) * 0.15;
  camera.position.y += (9 - camera.position.y) * 0.15;
  camera.lookAt(car.position.x + fx*3, 1.2, car.position.z + fz*3);

  // Objective
  const dxo = car.position.x - objective.position.x;
  const dzo = car.position.z - objective.position.z;
  if (!won && Math.hypot(dxo, dzo) < 4.5) {
    won = true;
    msgEl.textContent = '✅ MISSION PASSED!';
    msgEl.style.display = 'block';
  }
  objective.rotation.y += 0.025 * dt;
  objective.position.y = 2 + Math.sin(performance.now()*0.003) * 0.5;

  spdEl.textContent = 'Speed: ' + Math.round(Math.abs(speed)*100);
  objEl.textContent = won ? '🏁 Complete!' : '🚗 Yellow box tak jao';

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
